<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <title>스탬프 투어</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- 로그인 화면 -->
    <div id="loginScreen" class="login-screen">
      <div class="login-card">
        <div class="login-logo">스탬프투어</div>
        <h1 class="login-title">로그인 후 이어서 플레이</h1>
        <p class="login-desc">
          Google, 카카오톡, 게스트 중 하나로 시작할 수 있습니다.
          같은 계정으로 로그인하면 마지막 저장 상태를 자동으로 불러옵니다.
        </p>

        <div class="login-actions">
          <button id="googleLoginBtn" class="login-btn google" type="button">
            Google로 시작하기
          </button>
          <button id="kakaoLoginBtn" class="login-btn kakao" type="button">
            카카오톡으로 시작하기
          </button>
          <button id="guestLoginBtn" class="login-btn guest" type="button">
            게스트로 시작하기
          </button>
        </div>

        <p id="loginHelpText" class="login-help">
          로그인 상태를 확인하는 중입니다...
        </p>
      </div>
    </div>

    <div id="app">
      <header class="topbar">
        <div class="brand-wrap">
          <div class="brand">스탬프투어</div>

          <div id="accountBox" class="account-box hidden">
            <div id="accountName" class="account-name">로그인됨</div>
            <button id="logoutBtn" class="logout-btn" type="button">로그아웃</button>
          </div>
        </div>

        <div class="status-panel">
          <div class="status-card">
            <span class="status-label">남은 여행지</span>
            <strong id="remainingCount">31</strong>
          </div>
          <div class="status-card">
            <span class="status-label">완료</span>
            <strong id="completedCount">0 / 31</strong>
          </div>
        </div>
      </header>

      <main class="map-shell">
        <div id="mapViewport" class="map-viewport">
          <div id="mapStage" class="map-stage">
            <img
              id="mapImage"
              src="./gyeonggi-map/gyeonggi-map.png"
              alt="스탬프 투어 지도"
              draggable="false"
            />
            <div id="markerLayer" class="marker-layer"></div>
          </div>
        </div>
      </main>

      <div class="geo-bar">
        <span id="geoStatus">위치 확인 중...</span>
      </div>
    </div>

    <!-- 기본 팝업 -->
    <div id="spotModal" class="modal hidden" aria-hidden="true">
      <div class="modal-backdrop" data-close="spot"></div>

      <div class="modal-panel center-panel">
        <div class="spot-icon-wrap">
          <div class="spot-icon">📍</div>
        </div>

        <h2 id="spotTitle" class="modal-title">여행지</h2>
        <p id="spotMessage" class="modal-desc">어서오세요</p>

        <div class="location-box">
          <span class="location-label">위치 인증</span>
          <strong id="locationCheckText">확인 중...</strong>
        </div>

        <div class="modal-actions">
          <button
            id="missionStartBtn"
            class="btn btn-primary"
            type="button"
            disabled
          >
            미션수행
          </button>
          <button id="spotCloseBtn" class="btn btn-secondary" type="button">
            닫기
          </button>
        </div>
      </div>
    </div>

    <!-- 퀴즈 팝업 -->
    <div id="quizModal" class="modal hidden" aria-hidden="true">
      <div class="modal-backdrop" data-close="quiz"></div>

      <div class="modal-panel quiz-panel">
        <div id="quizContent" class="quiz-content">
          <div class="quiz-badge">O/X 퀴즈</div>
          <h2 class="modal-title">미션 수행</h2>

          <div class="quiz-question">
            대한민국의 국번은 <strong>82</strong>가 맞다?
          </div>

          <div class="quiz-choices">
            <button id="choiceO" class="choice-btn choice-o" type="button">
              O
            </button>
            <button id="choiceX" class="choice-btn choice-x" type="button">
              X
            </button>
          </div>

          <div id="quizResultArea" class="quiz-result-area"></div>

          <div class="modal-actions">
            <button
              id="missionCompleteBtn"
              class="btn btn-primary"
              type="button"
              disabled
            >
              미션수행 완료
            </button>
            <button id="quizCloseBtn" class="btn btn-secondary" type="button">
              닫기
            </button>
          </div>
        </div>

        <div id="quizFeedbackOverlay" class="quiz-feedback-overlay hidden">
          <div id="quizFeedbackSymbol" class="quiz-feedback-symbol">O</div>
          <div id="quizFeedbackMessage" class="quiz-feedback-message">
            성공입니다
          </div>
        </div>
      </div>
    </div>

    <!-- 토스트 -->
    <div id="toast" class="toast hidden"></div>

    <!-- Firebase compat SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

    <script src="./firebase-config.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
